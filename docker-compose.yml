services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yapp
      POSTGRES_PASSWORD: yapp_dev
      POSTGRES_DB: yapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapp -d yapp"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://yapp:yapp_dev@postgres:5432/yapp
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    environment:
      BACKEND_URL: http://server:3001
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads: