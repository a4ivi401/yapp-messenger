server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 150m;

    # API
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket + polling)
    location /socket.io/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Хешовані ассети Vite: ім'я файлу змінюється разом зі вмістом,
    # тому їх можна кешувати назавжди. =404 не дає SPA-fallback'у
    # віддати index.html замість відсутнього .js (інакше браузер отримає HTML у скрипті).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html завжди ревалідується: без цього браузер показує старий бандл
    # після перезбірки контейнера (евристичний кеш за Last-Modified).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}